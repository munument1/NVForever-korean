name: Korean installer hotfix 2026.11.26.2

on:
  push:
    branches: [codex/korean-installer-release]
    paths: [.github/workflows/korean-installer-hotfix.yml]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run installer regression tests
        working-directory: tools/korean-patcher
        run: python -m unittest -v
      - name: Install Windows packager
        run: python -m pip install pyinstaller==6.16.0
      - name: Download previous public installer and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download kr-test-2026.11.26.1 --repo $env:GITHUB_REPOSITORY --dir "$env:RUNNER_TEMP/nvf-old" --pattern NVForeverKoreanPatcher.exe --pattern SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify and reuse original embedded package
        working-directory: tools/korean-patcher
        run: |
          python rebuild_release.py "$env:RUNNER_TEMP/nvf-old/NVForeverKoreanPatcher.exe" "$env:RUNNER_TEMP/nvf-old/SHA256SUMS.txt" dist/NVForever-Korean-Patcher/package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --noconfirm --distpath dist/standalone NVForeverKoreanPatcher.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rebuild_release.py "$env:RUNNER_TEMP/nvf-old/NVForeverKoreanPatcher.exe" "$env:RUNNER_TEMP/nvf-old/SHA256SUMS.txt" dist/NVForever-Korean-Patcher/package --rebuilt dist/standalone/NVForeverKoreanPatcher.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $process = Start-Process -FilePath (Resolve-Path dist/standalone/NVForeverKoreanPatcher.exe) -ArgumentList '--verify' -PassThru -Wait
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
      - name: Collect installer and corresponding source
        run: |
          New-Item -ItemType Directory -Path release | Out-Null
          Copy-Item tools/korean-patcher/dist/standalone/NVForeverKoreanPatcher.exe release/
          $short = $env:GITHUB_SHA.Substring(0,9)
          git archive --format=zip --output="release/NVForever-Korean-source-$short.zip" $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $lines = Get-ChildItem release -File | Sort-Object Name | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + $_.Name }
          $lines | Set-Content -Encoding ascii release/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: korean-hotfix
          path: release/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: korean-hotfix
          path: release
      - name: Verify assets and publish new prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd release && sha256sum -c SHA256SUMS.txt)
          gh release view kr-test-2026.11.26.1 --repo "$GITHUB_REPOSITORY" --json body --jq .body > prior-notes.md
          python - <<'PY'
          import os
          from pathlib import Path
          old = Path("prior-notes.md").read_text(encoding="utf-8")
          old = old.replace("구조 불일치나 대상 레코드 누락이 발견되면 파일 교체 전에 설치를 중단합니다.", "구조 불일치 레코드는 원본 유지, 대상에 없는 레코드는 건너뛰며 일치하는 문자열만 적용합니다. 손상된 ESM 및 무결성 오류는 계속 설치를 중단합니다.")
          old = old.replace("설치기 테스트 14개", "설치기 테스트 16개")
          old = old.replace("현재 테스트 자료와 구조가 다른 ESM에는 적용이 중단될 수 있습니다.", "현재 테스트 자료와 구조가 다른 레코드는 원본으로 남으므로 일부 번역이 누락될 수 있습니다.")
          old = old.replace("NVForever-Korean-source-6906cb57d.zip", "NVForever-Korean-source-" + os.environ["GITHUB_SHA"][:9] + ".zip")
          notes = "## 2026-11-26.2 수정\n\n구조 불일치·누락 레코드가 있어도 설치를 계속합니다. 불일치 레코드는 원본 바이트를 보존하며 설치 로그에 경고를 남깁니다. 엔진·폰트·번역 패키지는 이전 릴리스와 동일합니다. 부분 적용 및 복원, 손상된 ESM 중단 테스트를 추가했습니다.\n\n" + old
          Path("release-notes.md").write_text(notes, encoding="utf-8")
          PY
          gh release create kr-test-2026.11.26.2 release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --draft --title "NVForever 한국어 UTF-8 테스트 설치기 · 2026-11-26.2" --notes-file release-notes.md
          gh release edit kr-test-2026.11.26.2 --repo "$GITHUB_REPOSITORY" --draft=false
