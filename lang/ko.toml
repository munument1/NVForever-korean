# Launcher general settings
"Aerial Perspective (Experimental)" = "대기 원근감 (실험적)"
"After each session: build, hardware, settings, mod list, how it ran and the log; no personal details, no saves. From the next start" = "게임 종료 후 빌드·하드웨어·설정·모드 목록·실행 상태·로그를 전송합니다. 개인정보와 세이브는 제외하며 다음 실행부터 적용됩니다."
"Authored Materials" = "재질 팩 적용"
"Counter: CPU Use" = "성능 표시 · CPU 사용량"
"Counter: Frame Graph" = "성능 표시 · 프레임 그래프"
"Counter: Frame Rate" = "성능 표시 · 프레임 속도"
"Counter: Frame Split" = "성능 표시 · 처리 시간 구분"
"Counter: GPU Memory" = "성능 표시 · 그래픽 메모리"
"Counter: GPU Use" = "성능 표시 · GPU 사용량"
"Counter: Last Figure" = "성능 표시 · 마지막 수치"
"Counter: Loaded" = "성능 표시 · 불러온 개체"
"Counter: RAM" = "성능 표시 · 메모리"
"Counter: Upscaling" = "성능 표시 · 업스케일링"
"Delete them now asks the server to delete every report this PC sent (within 7 days) and drops unsent ones; later reports get a new ID." = "지금 삭제를 누르면 이 PC에서 보낸 보고서의 삭제를 요청합니다. 서버 보고서는 7일 이내에 삭제하고 미전송 보고서는 즉시 삭제합니다. 이후 보고서에는 새 ID를 사용합니다."
"Desert Haze (Experimental)" = "사막 연무 (실험적)"
"Distant Lights (Experimental)" = "원거리 조명 (실험적)"
"Distant Objects" = "원거리 개체"
"Draws buildings, rocks and cliffs out to 7 x 7 or 9 x 9 cells as full models, not distant forms. Costs GPU time. Not in the original." = "7×7 또는 9×9 셀 범위의 건물·바위·절벽을 상세 모델로 표시합니다. GPU 부하가 늘어납니다. NVForever에서 추가한 기능입니다."
"Draws the rocks, shacks, pylons and signs the distant LOD leaves out, up to 8 or 12 cells away. Costs GPU time. Not in the original." = "원거리 LOD에서 생략되는 바위·오두막·송전탑·표지판을 최대 8셀 또는 12셀 거리까지 표시합니다. GPU 부하가 늘어납니다. NVForever에서 추가한 기능입니다."
"FSR Library" = "FSR 라이브러리"
"Frames a second, the mean frame time and the 1% low or the slowest frame (the row below chooses), from the time between frames." = "프레임 간 시간을 기준으로 초당 프레임 수, 평균 프레임 시간, 하위 1% 또는 가장 느린 프레임을 표시합니다. 마지막 수치는 아래 항목에서 선택합니다."
"Full-detail Scenery" = "원거리 상세 지형지물"
"Gore Shake" = "신체 파괴 시 화면 흔들림"
"How edges are smoothed: multisampling 2x, 4x or 8x (dearer at each step) or FXAA, SMAA or TAA afterwards. Shown while no upscaler is chosen." = "다중 샘플링 2배·4배·8배 또는 후처리 FXAA·SMAA·TAA로 가장자리를 부드럽게 합니다. 샘플 수가 많을수록 부하가 늘어납니다. 업스케일러를 사용하지 않을 때 표시됩니다."
"How far from you the sun casts shadows, as a part of the farthest shadow distance; 0%: none." = "태양 그림자를 표시할 거리를 최대 그림자 거리의 비율로 설정합니다. 0%이면 표시하지 않습니다."
"How far from you trees beyond the loaded cells are drawn as flat pictures, at most as far as distant objects are drawn. Farther runs slower." = "불러온 셀 밖의 나무를 평면 이미지로 표시할 거리입니다. 원거리 개체 표시 거리까지 늘릴 수 있으며, 거리가 늘수록 부하가 커집니다."
"How far the world slows while you choose targets in Classic: 100% stops it, 50% runs at half speed, 0% not at all. Enemies attack at anything less than a stop." = "클래식 모드에서 표적을 선택할 때 시간을 늦추는 정도입니다. 100%는 정지, 50%는 절반 속도, 0%는 정상 속도입니다. 시간이 흐르는 동안 적이 공격할 수 있습니다."
"Night Sky Detail (Experimental)" = "밤하늘 세부 효과 (실험적)"
"On: a body part blown apart near you (a gory kill) shakes the view too. Off: only real explosions shake it." = "켜면 가까이에서 신체가 파괴될 때도 화면이 흔들립니다. 끄면 실제 폭발 때만 흔들립니다."
"On: a thin dust haze thickens with distance and toward the ground, warmer toward the sun, as far as the weather's fog allows. Not in the original." = "켜면 날씨의 안개 범위 안에서 거리와 지면에 가까워질수록 짙어지는 먼지 연무를 표시합니다. 태양 방향에서는 더 따뜻한 색을 띱니다. NVForever에서 추가한 기능입니다."
"On: at night, lamps in the places beyond the loaded area show as small glows, so towns can be seen from afar. They light nothing. Not in the original." = "켜면 밤에 불러온 지역 밖의 조명을 작은 빛으로 표시해 멀리서도 마을을 볼 수 있습니다. 주변을 밝히는 효과는 없습니다. NVForever에서 추가한 기능입니다."
"On: far land takes on the sky's colours with distance, bluer at noon, warmer at dusk, brighter toward the sun, inside the weather's fog. Not in the original." = "켜면 안개 범위 안의 먼 지형에 하늘색이 반영됩니다. 정오에는 푸르게, 해질녘에는 따뜻하게, 태양 방향에서는 밝게 표현합니다. NVForever에서 추가한 기능입니다."
"On: ground textures a texture pack gives height maps for (textures\\pbr\\) show depth near you, for some GPU time. Without such a pack nothing changes." = "켜면 텍스처 팩이 textures\\pbr\\에 높이 맵을 제공하는 지면에 가까이서 깊이감을 표현합니다. GPU 부하가 늘어나며, 해당 팩이 있어야 효과가 나타납니다."
"On: ground textures stop repeating as a visible grid, for some GPU time. Off: each repeats every 256 units, as in the original." = "켜면 지면 텍스처의 격자 형태 반복을 줄입니다. GPU 부하가 늘어납니다. 끄면 원작처럼 256단위마다 반복합니다."
"On: pack materials reflect the sky outdoors and an approximation of the room and nearby lights indoors. Needs a material pack and Authored materials on. Takes effect at the next start." = "켜면 재질 팩 표면에 실외의 하늘과 실내의 방·주변 조명을 근사한 반사를 표시합니다. 재질 팩과 재질 팩 적용 설정이 필요합니다. 다음 실행부터 적용됩니다."
"On: stars twinkle a little, more near the horizon; the moon gets a glow and lights the clouds facing it, wider in hazy weather. Not in the original." = "켜면 별이 은은하게 반짝이며 지평선 근처에서는 효과가 강해집니다. 달에 빛 번짐을 더하고 달을 향한 구름을 밝힙니다. 흐릿한 날씨에는 더 넓게 퍼집니다. NVForever에서 추가한 기능입니다."
"On: surfaces whose textures a texture pack gives material maps for (textures\\pbr\\) are shaded from them. Off: every surface uses the game's own values. Takes effect at the next start." = "켜면 텍스처 팩이 textures\\pbr\\에 제공한 재질 맵으로 표면을 표현합니다. 끄면 게임의 기본 재질값을 사용합니다. 다음 실행부터 적용됩니다."
"On: when choices appear the view returns to the speaker (with the close-up off). Needs \"Turn to Each Other\"." = "켜면 대화 선택지가 나타날 때 화자 쪽으로 시점을 돌립니다. 클로즈업을 끄고 서로 마주보기 설정을 켜야 합니다."
"On: where ground textures meet, the new one shows through its brighter stones and clumps first instead of an even fade. Fully painted ground is unchanged." = "켜면 지면 텍스처가 만나는 경계에서 밝은 돌과 흙덩이부터 드러나도록 혼합합니다. 한 텍스처로 덮인 지면은 유지합니다."
"On: while a louder sound plays near you (machines, voices, shots, creatures), the noise you make is not heard. Not in the original." = "켜면 주변의 기계·목소리·총성·생물 소리가 더 큰 동안 플레이어의 소음을 감춥니다. NVForever에서 추가한 기능입니다."
"Reflections on Authored Materials" = "재질 팩 반사 효과"
"Reports Already Sent" = "전송된 보고서"
"Send Reports to Help Fix NVForever" = "NVForever 개선을 위한 보고서 전송"
"Sounds of the World Cover Your Noise" = "주변 소리로 플레이어 소음 가리기"
"Sunlight shifts across shallow beds. Deeper water looks murkier from shore and underwater. Selected rivers drift downstream." = "얕은 물 바닥에 햇빛 무늬가 움직입니다. 깊은 물은 해안과 수중에서 더 탁하게 보이며, 일부 강은 하류 방향으로 흐릅니다."
"Terrain Anti-Tiling" = "지면 텍스처 반복 줄이기"
"Terrain Height Blending" = "지면 높이 기반 혼합"
"Terrain Parallax" = "지면 시차 효과"
"The frame rate row's last figure, over 10 seconds: 1% low (the mean of the slowest hundredth of frames) or the slowest frame." = "프레임 속도 표시의 마지막 수치를 선택합니다. 최근 10초의 하위 1% 프레임 평균 또는 가장 느린 프레임을 표시합니다."
"The frame times of the last 5 seconds as a line under the frame rate, the newest at the right, a faint line at 60 Hz (16.7 ms)." = "최근 5초의 프레임 시간을 그래프로 표시합니다. 최신 프레임은 오른쪽에 놓이며, 60Hz 기준선은 16.7ms입니다."
"The game's RAM and the machine's RAM in use. Marked ! while under a tenth is free and the game keeps fewer unused assets. Windows only." = "게임과 PC의 메모리 사용량을 표시합니다. 여유 메모리가 10% 미만이면 !를 표시하고 사용하지 않는 자원 보관량을 줄입니다. Windows에서 지원합니다."
"The graphics memory the game holds against the driver's budget, read every 2 seconds. Marked ! while near it the game keeps fewer unused assets." = "게임의 그래픽 메모리 사용량과 드라이버의 할당 한도를 2초마다 표시합니다. 한도에 가까워지면 !를 표시하고 사용하지 않는 자원 보관량을 줄입니다."
"Tree Distance" = "나무 표시 거리"
"V.A.T.S." = "V.A.T.S."
"Water Caustics and River Flow" = "수중 집광 효과와 강물 흐름"
"What FSR upscales with: NVForever's built-in FSR 3.1, or a FidelityFX library in the game's folder (for tools that replace the upscaler)." = "NVForever에 내장된 FSR 3.1 또는 게임 폴더의 FidelityFX 라이브러리로 업스케일링합니다. 외부 라이브러리는 업스케일러 교체 도구용입니다."
"What a frame took on the main thread, the render thread (its wait for the window in brackets) and the GPU. The GPU part needs this row on at the start." = "프레임별 메인 스레드·렌더 스레드·GPU 처리 시간을 표시합니다. 괄호 안은 창 대기 시간입니다. GPU 시간을 보려면 게임 시작 전에 이 항목을 켜야 합니다."
"What the game holds now: the cells in the physics world, placed objects with a model, actors with a skeleton and engine entities." = "현재 불러온 물리 셀, 모델이 있는 배치 개체, 골격이 있는 액터, 엔진 개체의 수를 표시합니다."
