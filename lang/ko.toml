# Launcher interface
" Download: {arg0}." = " 다운로드 크기 {arg0}."
"A mouse click only." = "마우스로 클릭해 주세요."
"Add-ons found: {arg0}" = "설치된 추가 콘텐츠 · {arg0}"
"An NVIDIA RTX graphics card with a current driver ({gpu})" = "최신 드라이버가 설치된 NVIDIA RTX 그래픽 카드 ({gpu})"
"An interrupted update could not be finished: {e}. Download the release from its page." = "중단된 업데이트를 완료하지 못했습니다. {e}. 릴리스 페이지에서 내려받아 주세요."
"An optional upscaler beside FSR 3.1 (and DLSS frame generation on RTX 40 or newer). NVForever ships no NVIDIA file: the four upscaling and four frame generation files come from NVIDIA's own Streamline release, under NVIDIA's licence." = "FSR 3.1과 함께 선택할 수 있는 업스케일러입니다. RTX 40 이상에서는 DLSS 프레임 생성도 지원합니다. 업스케일링 파일 4개와 프레임 생성 파일 4개는 NVIDIA 라이선스에 따라 NVIDIA Streamline 릴리스에서 내려받습니다."
"An update to v{v} was interrupted; it has been finished." = "중단됐던 v{v} 업데이트를 완료했습니다."
"Ask nv-forever.com (and GitHub) for the news when the launcher opens" = "런처를 열 때 nv-forever.com과 GitHub에서 소식을 가져옵니다."
"Back to the New Vegas opening; Save to keep it" = "뉴베가스 기본 시작으로 되돌립니다. 저장하면 적용됩니다."
"Browse…" = "찾아보기…"
"Check again" = "다시 확인"
"Checking the download…" = "다운로드 파일 확인 중…"
"Checking the release…" = "릴리스 확인 중…"
"Choose DLSS as the Upscaler below (or in the game's settings)." = "아래 업스케일러 항목이나 게임 설정에서 DLSS를 선택하세요."
"Choose the game program…" = "게임 실행 파일 선택…"
"Clear" = "초기화"
"Close the game first: it holds this PC's report ID while it runs." = "먼저 게임을 종료하세요. 실행 중에는 이 PC의 보고서 ID를 사용합니다."
"Close the launcher when the game starts" = "게임 시작 시 런처 닫기"
"Could not delete the reports: {e}" = "보고서를 삭제하지 못했습니다. {e}"
"Delete them" = "삭제"
"Delete them now" = "지금 삭제"
"Delete your reports?" = "보고서를 삭제할까요?"
"Deleting…" = "삭제 중…"
"Download DLSS fetches eight files from NVIDIA's Streamline 2.14.16 release on GitHub: the six sl.* files (MIT licence) and nvngx_dlss.dll and nvngx_dlssg.dll, under the licence below. Each file is checked against its pinned SHA-256 and NVIDIA's signatures, and nothing is written unless all pass; a file already in the dlss folder is kept." = "GitHub의 NVIDIA Streamline 2.14.16 릴리스에서 파일 8개를 내려받습니다. sl.* 파일 6개는 MIT 라이선스를 따르며, nvngx_dlss.dll과 nvngx_dlssg.dll은 아래 라이선스를 따릅니다. 모든 파일의 SHA-256과 NVIDIA 서명을 확인한 뒤 저장합니다. dlss 폴더에 이미 있는 파일은 유지합니다."
"Downloading…" = "다운로드 중…"
