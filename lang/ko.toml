"{n}% slower" = "{n}% 느리게"
"Off" = "끄기"
"Download DLSS" = "DLSS 다운로드"
"NVForever fetches eight files for DLSS upscaling and frame generation from NVIDIA's Streamline 2.14.16 release on GitHub: sl.interposer.dll, sl.common.dll, sl.dlss.dll, sl.dlss_g.dll, sl.reflex.dll and sl.pcl.dll, under Streamline's MIT licence, and nvngx_dlss.dll and nvngx_dlssg.dll, under NVIDIA's RTX SDKs licence below. Nothing is downloaded unless you accept it." = "NVForever는 DLSS 업스케일링과 프레임 생성을 위해 GitHub의 NVIDIA Streamline 2.14.16 릴리스에서 파일 8개를 가져옵니다. sl.interposer.dll, sl.common.dll, sl.dlss.dll, sl.dlss_g.dll, sl.reflex.dll, sl.pcl.dll에는 Streamline의 MIT 라이선스가 적용되며, nvngx_dlss.dll과 nvngx_dlssg.dll에는 아래의 NVIDIA RTX SDK 라이선스가 적용됩니다. 동의한 뒤에 다운로드가 시작됩니다."
"NVIDIA's RTX SDKs licence for nvngx_dlss.dll and nvngx_dlssg.dll" = "nvngx_dlss.dll 및 nvngx_dlssg.dll에 적용되는 NVIDIA RTX SDK 라이선스"
"Lines {first} to {last} of {total}. PgUp, PgDn, the arrow keys or the mouse wheel scroll." = "전체 {total} 줄 중 {first}~{last} 줄. Page Up, Page Down, 방향키 또는 마우스 휠로 스크롤할 수 있습니다."
"I accept starts the download; the game goes on meanwhile." = "동의하면 다운로드가 시작됩니다. 다운로드 중에도 게임을 계속할 수 있습니다."
"I accept" = "동의"
"Open on GitHub" = "GitHub에서 열기"
"Downloading DLSS" = "DLSS 다운로드 중"
"Connecting to GitHub..." = "GitHub에 연결하는 중..."
"Reading the archive's list of files..." = "압축 파일의 목록을 읽는 중..."
"File {index} of {of}: {name}" = "{of} 개 중 {index} 번째 파일 · {name}"
"Checking the files..." = "파일을 검사하는 중..."
"Putting the files in the dlss folder..." = "dlss 폴더에 파일을 저장하는 중..."
"{fetched} MB of {total} MB" = "{fetched}MB / {total}MB"
"The game goes on meanwhile. Hide keeps the download running; its choice on the Upscaler row shows this again. Loading a save, going to the main menu or quitting stops it." = "다운로드 중에도 게임을 계속할 수 있습니다. 창을 숨겨도 다운로드는 계속되며 업스케일러 설정에서 다시 열 수 있습니다. 저장 파일을 불러오거나 메인 메뉴로 돌아가거나 게임을 종료하면 다운로드가 중단됩니다."
"Hide" = "숨기기"
"Cancel download" = "다운로드 취소"
"Download finished" = "다운로드 완료"
"DLSS is ready: restart NVForever to use it." = "DLSS가 준비되었습니다. 사용하려면 NVForever를 다시 시작하세요."
"Installed in {folder}." = "{folder}에 설치했습니다."
"Close" = "닫기"
"DLSS was not downloaded" = "DLSS 다운로드 실패"
"No answer from GitHub: check the connection, then try again." = "GitHub에서 응답이 없습니다. 연결 상태를 확인하고 다시 시도하세요."
"GitHub answered with an error (HTTP {status})." = "GitHub에서 오류를 반환했습니다(HTTP {status})."
"What GitHub sent was not NVIDIA's expected archive; nothing was kept." = "받은 압축 파일이 예상한 NVIDIA 파일과 달라 저장하지 않았습니다."
"{name} did not match the tested release; nothing was kept." = "{name} 파일이 검증된 릴리스와 달라 저장하지 않았습니다."
"{name} failed its signature check; nothing was kept." = "{name} 파일의 서명 검증에 실패해 저장하지 않았습니다."
"The dlss folder already holds {name}, which was left as it is: remove it, or copy the files by hand." = "dlss 폴더에 이미 {name} 파일이 있습니다. 기존 파일을 제거하거나 필요한 파일을 직접 복사하세요."
"The files could not be written to the dlss folder." = "dlss 폴더에 파일을 저장할 수 없습니다."
"The download stopped on an internal error; the log says more." = "내부 오류로 다운로드가 중단되었습니다. 자세한 내용은 로그에서 확인할 수 있습니다."
"Details: {why}" = "상세 정보 · {why}"
"Download cancelled" = "다운로드가 취소되었습니다"
"Nothing was written." = "저장된 파일이 없습니다."
"Or get the files by hand: open the release page, download streamline-sdk-v2.14.16.zip and copy sl.interposer.dll, sl.common.dll, sl.dlss.dll, nvngx_dlss.dll, sl.dlss_g.dll, nvngx_dlssg.dll, sl.reflex.dll and sl.pcl.dll from its bin\\x64 folder into the dlss folder (never nvngx_update.exe), then restart." = "직접 설치하려면 릴리스 페이지에서 streamline-sdk-v2.14.16.zip을 받으세요. 압축의 bin\\x64 폴더에서 sl.interposer.dll, sl.common.dll, sl.dlss.dll, nvngx_dlss.dll, sl.dlss_g.dll, nvngx_dlssg.dll, sl.reflex.dll, sl.pcl.dll을 dlss 폴더에 복사한 뒤 다시 시작하세요. nvngx_update.exe는 복사 대상에서 제외하세요."
