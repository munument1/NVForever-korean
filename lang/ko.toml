# Setting descriptions
"On: a controller button, stick or trigger selects Controller; a key or mouse click selects Keyboard and Mouse (mouse motion does not). Off: choose Input Device yourself." = "켜면 컨트롤러의 버튼, 스틱 또는 트리거를 조작할 때 컨트롤러로 전환하고, 키를 누르거나 마우스를 클릭하면 키보드와 마우스로 전환합니다. 마우스를 움직이는 것만으로는 전환하지 않습니다. 끄면 입력 장치를 직접 선택합니다."
"On: lines are spoken. Off: they are silent from the next line on, and still last as long as their sound." = "켜면 대사를 음성으로 재생합니다. 끄면 다음 대사부터 소리를 끄며, 재생 시간은 동일합니다."
"On: at the start of a conversation the actor turns to the player and the view turns to the actor." = "켜면 대화가 시작될 때 상대가 플레이어를 향하고, 시점도 상대에게 돌아갑니다."
"On: in a conversation the view closes in on the speaker, the background out of focus; the mouse moves only the cursor. Off: you can look around." = "켜면 대화 상대가 확대되고 배경은 흐려집니다. 마우스는 커서만 움직입니다. 끄면 대화 중에도 주위를 둘러볼 수 있습니다."
"On: \"[Tab] Goodbye\" stands at the left of the dialogue box while a Goodbye choice is offered. Off: hidden; Tab still says goodbye." = "대화 종료 선택지가 있을 때 대화 상자 왼쪽에 [Tab] 종료를 표시합니다. 끄면 안내만 숨기고 Tab으로 대화를 종료할 수 있습니다."
"Controller only. On: the right stick turns slower over a nearby hostile, and aiming down the sights pulls the view onto one near the crosshair." = "컨트롤러 전용. 조준점이 가까운 적을 지나갈 때 오른쪽 스틱의 회전 속도를 줄입니다. 조준기를 들면 조준점 가까이 있는 적에게 시점을 당깁니다."
"How much slower the right stick turns while the crosshair is on a nearby hostile (0: not at all)." = "조준점이 가까운 적에게 있을 때 오른쪽 스틱의 회전 속도를 얼마나 줄일지 정합니다. 0이면 감속하지 않습니다."
"How hard aiming down the sights turns the view onto a hostile near the crosshair (0: not at all). Push the right stick away to break it." = "조준 중 조준점 근처의 적에게 시점을 당기는 강도입니다. 0은 끔입니다. 오른쪽 스틱을 적에게서 멀리 움직이면 고정을 풉니다."
"On: the Pip-Boy is worn and the menus come up on the arm. Off: it is taken off and the menus show full screen, as always without a Pip-Boy." = "켜면 팔에 핍보이를 착용하고 팔 위에 메뉴를 표시합니다. 끄면 핍보이를 벗고 메뉴를 전체 화면에 표시합니다."
"When a VATS shot kills its last mark, a camera shows the kill. Last enemy: only when no other enemy still fights you. Every kill: always. Off: never." = "V.A.T.S. 사격으로 마지막 조준 대상을 처치할 때 카메라를 전환합니다. 마지막 적은 다른 전투 중인 적이 없을 때, 모든 처치는 항상 표시합니다. 끄면 전환하지 않습니다."
"What the V.A.T.S. key starts. Classic: the world stops and you pick body parts to hit. Mark and Fire: time runs very slowly while you mark targets." = "V.A.T.S. 키를 눌렀을 때의 동작입니다. 클래식에서는 시간이 멈추고 조준할 신체 부위를 고릅니다. 표시 후 사격에서는 대상에 표시하는 동안 시간이 매우 느리게 흐릅니다."
"On: you and the NPCs move at 75% of your speed while a reload runs. Off: reloading does not slow anyone, as in the original." = "켜면 재장전 중 플레이어와 NPC의 이동 속도가 75%로 줄어듭니다. 끄면 원본과 같이 재장전 중에도 속도가 유지됩니다."
"How hard the fights are: from Very Easy (your hits do double damage, you take half) to Very Hard (half and double); Normal as they are." = "전투 난이도입니다. 매우 쉬움에서는 두 배의 피해를 주고 절반만 받습니다. 매우 어려움에서는 절반의 피해를 주고 두 배로 받습니다. 보통은 기본 피해량을 사용합니다."
"On: with a gun or thrown weapon drawn the crosshair opens with how wide your shots spread now. Off: the arrows stay together." = "켜면 총기나 투척 무기를 들었을 때 현재 탄 퍼짐에 맞춰 조준점이 벌어집니다. 끄면 화살표가 벌어지지 않습니다."
"With Dynamic crosshair on. Cross: four bars that part with the spread. Arrows: the plain crosshair's two arrows part instead." = "동적 조준점을 켰을 때 적용됩니다. 십자는 퍼짐에 따라 막대 네 개가, 화살표는 기본 조준점의 화살표 두 개가 벌어집니다."
"On: in third person with your weapon away the mouse turns the camera around you and you run whichever way you push. Off: the camera stays behind you." = "켜면 3인칭에서 무기를 집어넣었을 때 마우스로 캐릭터 주위를 둘러보고 입력한 방향으로 달립니다. 끄면 카메라가 캐릭터 뒤를 따라갑니다."
"The language of NVForever's own words (menus, messages). The game's own text is the install's." = "NVForever의 메뉴와 메시지에 사용할 언어입니다. 게임 데이터의 언어는 설치된 플러그인에 따릅니다."
"World sounds echo as the place you are in does (a cave, a hall, a small room). Off: they do not." = "동굴, 복도, 작은 방처럼 현재 장소의 특성에 따라 주변 소리가 울립니다. 끄면 잔향이 사라집니다."
"What people say around you echoes in the place you are in, as Reverb does for world sounds. Conversations stay dry." = "주변 NPC의 말소리에 현재 장소의 잔향을 적용합니다. 대화 메뉴의 음성에는 잔향을 적용하지 않습니다."
"How loud all sound is: each volume below is a part of this one." = "전체 소리의 음량입니다. 아래의 개별 음량은 이 값에 비례합니다."
"The music of the place you are in and the main menu's theme." = "현재 장소의 배경 음악과 메인 메뉴 음악입니다."
"Footsteps, jumps and landings, yours and everyone's." = "플레이어와 다른 인물의 발소리, 점프 및 착지 소리입니다."
"Spoken lines: conversations and what people say around you." = "대화와 주변 인물의 말소리입니다."
"Every other sound: weapons, impacts, menus, doors and the sounds of places." = "무기, 충격, 메뉴, 문, 주변 환경 등 그 밖의 소리입니다."
"Radio stations, from the Pip-Boy and from radios in the world." = "핍보이와 월드의 라디오에서 재생하는 방송입니다."
"On: animations, wind, water and sky stand still in conversations, the inventory and other menus, as in the original. Off: only game logic waits." = "켜면 원본과 같이 대화, 소지품 및 기타 메뉴에서 애니메이션, 바람, 물, 하늘을 멈춥니다. 끄면 게임 진행만 멈춥니다."
"The names and pictures of the controller's buttons in prompts and hints. Auto: a PlayStation's when the controller says it is one, else an Xbox's." = "안내에 표시할 컨트롤러 버튼의 이름과 아이콘입니다. 자동은 컨트롤러가 PlayStation 기기로 인식되면 해당 버튼을, 그 외에는 Xbox 버튼을 표시합니다."
"On: two bars under the sneak word show how lit you are and how much noise you make, as detection counts them. Not in the original." = "켜면 은신 문구 아래의 막대 두 개가 탐지에 영향을 주는 밝기와 소음을 표시합니다. 원본에는 없는 기능입니다."
"On: the game saves to the autosave slot after each loading screen (doors, coc, a script moving you); fast travel has its own row." = "켜면 문 이동, coc 명령, 스크립트 이동으로 로딩 화면이 끝날 때마다 자동 저장 슬롯에 저장합니다. 빠른 이동은 별도 설정입니다."
"On: the game saves to the autosave slot when a fast travel arrives." = "켜면 빠른 이동으로 목적지에 도착했을 때 자동 저장 슬롯에 저장합니다."
"On: the game saves to the autosave slot when a wait ends with at least one hour passed." = "켜면 한 시간 이상 대기를 마쳤을 때 자동 저장 슬롯에 저장합니다."
"On: the game saves to the autosave slot when the player wakes from a sleep of at least one hour." = "켜면 한 시간 이상 수면을 마쳤을 때 자동 저장 슬롯에 저장합니다."
"On: a script's Autosave saves to the autosave slot (quest milestones), SystemSave to the system slot, ForceSave as a new save." = "켜면 스크립트의 Autosave는 퀘스트 진행 등에서 자동 저장 슬롯에, SystemSave는 시스템 슬롯에, ForceSave는 새 슬롯에 저장합니다."
"On: you need water, food and sleep, stimpaks heal over time, ammo has weight, crippled limbs need a doctor's bag or a doctor. Off: none of that." = "켜면 물, 음식, 수면이 필요하고 스팀팩이 체력을 서서히 회복합니다. 탄약에 무게가 생기고 부상당한 팔다리는 의사 가방이나 의사가 필요합니다. 끄면 이 규칙을 적용하지 않습니다."
"One part of the colour above, 0 to 255; drag the meter or use Left and Right." = "위에 표시한 색상의 한 채널을 0부터 255까지 조정합니다. 막대를 끌거나 좌우 방향키를 사용하세요."
"On: the music of the place you are in plays. Off: it is silent and goes on unheard." = "켜면 현재 장소에 맞는 음악이 들립니다. 끄면 재생은 계속되지만 소리를 내지 않습니다."
"Size of the in-game HUD, independent of menu scale. Takes effect at the next start." = "게임 중 HUD의 크기입니다. 메뉴 크기와 별개이며 다음 실행부터 적용됩니다."
"Size of the main, pause and other menus, independent of HUD scale. Takes effect at the next start." = "메인 메뉴, 일시 정지 메뉴 등을 표시할 크기입니다. HUD 크기와 별개이며 다음 실행부터 적용됩니다."
"On: a speaker's face moves with the line. Off: a face that is moving eases back to rest." = "켜면 대사에 맞춰 화자의 얼굴이 움직입니다. 끄면 움직이던 얼굴은 서서히 원래 상태로 돌아갑니다."
"On: actors turn their heads to the player and to others near them. Off: heads ease back to their animation." = "켜면 캐릭터가 고개를 돌려 플레이어와 다른 주변 캐릭터를 바라봅니다. 끄면 기존 애니메이션으로 자연스럽게 전환합니다."
"On: on slopes and steps actors bend their knees and set each foot on the ground under it. Off: the legs play the animation as it is." = "켜면 경사와 계단에서 캐릭터가 무릎을 굽혀 발을 지면에 맞춥니다. 끄면 기본 다리 애니메이션을 재생합니다."
"On: the sky shows the game's time of day as it passes. Off: the sky keeps its hour while the game's clock runs on ([ and ] still set it)." = "켜면 게임 시간에 따라 하늘이 바뀝니다. 끄면 게임 시간은 흐르지만 하늘은 기존 시간대에 머뭅니다. [와 ] 키로 시간을 바꿀 수 있습니다."
"The window's size, or in full screen the monitor's (its own size: borderless). A new one goes back after 20 seconds unless you keep it." = "창 모드에서는 창의 크기, 전체 화면에서는 모니터의 해상도(테두리 없음)입니다. 변경을 적용하지 않으면 20초 뒤 이전 값으로 돌아갑니다."
"On: the game fills its monitor without a frame, at the full screen resolution above. Off: a window of the window resolution." = "켜면 위의 전체 화면 해상도로 테두리 없이 모니터를 채웁니다. 끄면 창 해상도에 맞춰 창을 엽니다."
"The display the game opens on in full screen (the main display until you pick one)." = "전체 화면 모드에서 사용할 모니터입니다. 선택하기 전에는 기본 모니터에서 열립니다."
"On: in first person you see your own body and legs when you look down. Off: only the arms and the weapon are drawn, as in the original." = "켜면 1인칭 시점으로 아래를 볼 때 자신의 몸과 다리가 보입니다. 끄면 원본과 같이 팔과 무기만 보입니다."
"On: the switches below shape how your character, view and weapon move. Off: none of them acts, as in the original; each keeps its own choice." = "켜면 아래의 설정으로 캐릭터, 시점, 무기의 움직임을 조정합니다. 끄면 원본의 동작을 사용하고 개별 설정값은 보존됩니다."
"How heavy it all feels: 100% as made; lower makes speeding up, stopping and crouching quicker and cuts the extra time drawing and aiming take." = "이동에 적용하는 무게감입니다. 100%는 기본값입니다. 낮추면 가속, 정지, 웅크리기와 무기를 들고 조준하는 동작이 빨라집니다."
"On: you speed up, glide to a stop and brake before turning; crouching eases and landings dip and slow you by the fall. Off: as in the original." = "켜면 서서히 가속하고, 미끄러지듯 멈추며, 방향을 바꾸기 전에 감속합니다. 웅크리기와 착지가 자연스러워지며 높은 곳에서 떨어질수록 착지 시 더 크게 숙이고 감속합니다. 끄면 원본의 동작을 사용합니다."
"On: drawing, putting away and aiming a weapon take a moment longer, and longer still for heavier weapons. Off: the original's timing." = "켜면 무기를 꺼내거나 집어넣고 조준할 때 조금 더 오래 걸립니다. 무거운 무기일수록 차이가 커집니다. 끄면 원본의 시간을 사용합니다."
"On: a shot's kick eases the view up and part of it settles back down, and the view nudges back. Off: the whole kick stays, as in the original." = "켜면 발사 반동으로 시점이 서서히 올라갔다 일부 되돌아오고, 시점이 약간 뒤로 밀립니다. 끄면 원본과 같이 반동이 그대로 반영됩니다."
"On: hold the Sprint key (set it in Controls) to run faster, spending AP every second; stopping low on AP leaves you out of breath. Off: as in the original." = "켜면 조작에서 지정한 전력 질주 키를 누르는 동안 AP를 소모하며 빠르게 달립니다. AP가 적을 때 멈추면 숨이 찹니다. 끄면 원본의 동작을 사용합니다."
"Turn on Sprint in NVF Features > Advanced Movement first." = "NVF 기능의 고급 이동에서 전력 질주를 먼저 켜세요."
"Turn on the Global Toggle in NVF Features > Advanced Movement first." = "NVF 기능의 고급 이동에서 전체 켜기·끄기를 먼저 켜세요."
"On: in first person the arms and weapon lag behind turns and steps, bob, dip, breathe and recoil, heavier weapons more. Off: they stay still." = "켜면 1인칭에서 팔과 무기가 회전이나 걸음에 한 박자 늦게 따라오고, 흔들림, 호흡, 반동을 표현합니다. 무거운 무기일수록 효과가 큽니다. 끄면 이러한 움직임이 사라집니다."
"On: in first person drawing, aiming, attacks, reloads and the Pip-Boy ease in and settle softly, taking no longer. Off: the original's clips." = "켜면 1인칭에서 무기 꺼내기, 조준, 공격, 재장전, 핍보이 애니메이션의 시작과 끝을 부드럽게 합니다. 동작 시간은 동일합니다. 끄면 원본 애니메이션을 사용합니다."
"On: in first person the view bobs with each step, breathes, gets out of breath after running and jolts when you are hit. Off: it stays still." = "켜면 1인칭 시점이 걸음과 호흡에 맞춰 흔들리며, 전력 질주 뒤 숨이 차거나 피격되면 움직임이 커집니다. 끄면 시점은 고정됩니다."
"On: in first person a drawn weapon lowers at a wall or a friend and comes back up when you aim or fire. Off: it stays up, as in the original." = "켜면 1인칭에서 벽이나 아군에게 가까이 갔을 때 무기를 내리고, 조준하거나 발사할 때 다시 듭니다. 끄면 원본과 같이 무기를 든 상태를 유지합니다."
"On: aiming a gun lines its sights up with your eye and hides the crosshair. Off: the gun is held low with the crosshair, as in the original." = "켜면 조준 시 무기의 조준기와 시선이 일치하고 조준점이 숨겨집니다. 끄면 원본과 같이 무기를 낮게 들고 조준점을 표시합니다."
"On: a scoped gun stays on screen and shows the zoomed view in its lens. Off: the full-screen scope picture, as in the original." = "켜면 조준 시 무기가 화면에 남고 조준경 렌즈에 확대 영상을 표시합니다. 끄면 원본처럼 전체 화면에 조준경 이미지를 표시합니다."
"The sun's shadows: Off, Performance (cheaper outdoors; moving shadows update at half the frame rate) or Quality. The original casts none from the world." = "태양 그림자의 품질입니다. 끄기, 성능, 품질을 선택할 수 있습니다. 성능은 야외 부하를 줄이고 움직이는 그림자를 프레임률의 절반으로 갱신합니다. 원본에서는 월드 물체가 태양 그림자를 만들지 않습니다."
"On: grass grows on the landscape; the cells around you get theirs over the next frames. Off: it is hidden and none grows on new cells." = "켜면 지형에 풀이 자라고, 주변 셀에 몇 프레임에 걸쳐 풀을 표시합니다. 끄면 풀을 숨기고 새 셀에 풀을 생성하지 않습니다."
"On: distant land, buildings and trees are drawn beyond the loaded cells (outdoors). Off: the world ends at the loaded cells." = "켜면 야외에서 불러온 셀보다 먼 지형, 건물, 나무를 표시합니다. 끄면 불러온 셀까지만 그립니다."
"On: the picture is graded by the worldspace's, the weather's and the cell's image space. Off: the picture as lit, for comparisons." = "켜면 월드 공간, 날씨, 셀의 이미지 공간 설정에 따라 색을 보정합니다. 끄면 비교를 위해 조명 결과를 그대로 표시합니다."
"On: the position, loading counts and key help are written over the picture. Off by default in the game." = "켜면 위치, 로딩 수치, 키 안내가 화면에 표시됩니다. 게임의 기본값은 끄기입니다."
"On: a cross is drawn at each impact and a line from the muzzle along each hitscan shot." = "켜면 충돌 위치마다 십자를 표시하며 히트스캔 사격에는 총구에서 이어지는 선을 그립니다."
"On: the player takes no damage from hits and cannot be killed by them." = "켜면 플레이어가 공격으로 피해를 입거나 사망하지 않습니다."
"On: the navmesh near the camera and the walking NPCs' paths are drawn." = "켜면 카메라 근처의 이동 경로 메시와 이동 중인 NPC의 경로가 보입니다."
"On: a panel of performance readings at the top right; the Counter rows below choose what it shows. Not in the original." = "켜면 화면 오른쪽 위에 성능 수치를 표시합니다. 아래 표시 항목 설정에서 수치를 선택할 수 있습니다. 원본에는 없는 기능입니다."
"Vertical sync: frames wait for the display (no tearing). Variable refresh: for a G-Sync or FreeSync screen. Off: frames show at once (may tear)." = "수직 동기화는 프레임을 화면 주사율에 맞춰 화면 찢김을 방지합니다. 가변 주사율은 G-Sync나 FreeSync 화면용입니다. 끄면 즉시 프레임을 표시해 화면이 찢어질 수 있습니다."
"FSR 3.1 or NVIDIA DLSS rebuilds the world at display resolution, at the mode below. DLSS needs an NVIDIA RTX card and its files in the dlss folder." = "FSR 3.1 또는 NVIDIA DLSS가 아래 모드에 따라 화면 해상도로 월드 이미지를 재구성합니다. DLSS에는 NVIDIA RTX 그래픽 카드와 dlss 폴더의 파일이 필요합니다."
"The share of the screen the world is drawn at; the upscaler rebuilds the rest. Native AA: full size. Quality to Ultra Performance: ever faster." = "월드를 그리는 화면 해상도 비율입니다. 나머지는 업스케일러가 재구성합니다. 네이티브 해상도에서 안티앨리어싱은 원래 해상도를 사용하며, 품질에서 최고 성능으로 갈수록 속도가 빨라집니다."
"Which DLSS model rebuilds the picture (NVIDIA calls them presets). Default, recommended: NVIDIA picks per mode. Only while DLSS draws." = "화면 재구성에 사용할 DLSS 모델입니다. NVIDIA는 이를 사전 설정이라고 부릅니다. 권장 기본값에서는 NVIDIA가 모드별로 선택합니다. DLSS 사용 중에만 적용됩니다."
"The game's field of view in degrees across a 4:3 picture (75 as the original's default); wider screens see more at the sides." = "4:3 화면을 기준으로 한 시야각(도)입니다. 원본 기본값은 75도입니다. 화면이 넓을수록 양옆이 더 많이 보입니다."
"The angle the first-person arms and weapon are drawn with, in degrees (55 as the original's default): lower draws them bigger and closer." = "1인칭 팔과 무기의 시야각(도)입니다. 원본 기본값은 55도입니다. 값을 낮추면 팔과 무기가 더 크고 가깝게 보입니다."
"At most this many frames a second (Off: no limit of its own). A lower limit keeps the computer cooler and quieter." = "초당 프레임 수를 이 값으로 제한합니다. 끄면 자체 제한을 사용하지 않습니다. 낮게 설정하면 발열과 소음을 줄일 수 있습니다."
"How many times a second the physics moves the world on. Higher answers the keys sooner and collides more finely, but costs the processor more." = "초당 물리 계산 횟수입니다. 높이면 입력 응답과 충돌 정밀도가 개선되지만 CPU 부하가 증가합니다."
"How far from you objects of the loaded cells (buildings, rocks, furniture, clutter) are drawn. Lower draws fewer and runs faster." = "불러온 셀의 건물, 바위, 가구와 잡동사니를 표시할 거리입니다. 값을 줄이면 그리는 물체가 줄어 성능이 개선됩니다."
"How far from you people and creatures are drawn, as a part of the farthest the loaded cells reach." = "불러온 셀의 최대 범위를 기준으로 인물과 생물을 표시할 거리입니다."
"How far from you items lying in the world are drawn, as a part of the farthest the loaded cells reach." = "불러온 셀의 최대 범위를 기준으로 바닥에 놓인 아이템을 표시할 거리입니다."
"How far from you grass is drawn, as a part of the farthest grass distance and its fade range." = "최대 표시 거리와 페이드 범위를 기준으로 풀을 표시할 거리입니다."
"How the sun's shadow edges are softened: Fast (harder, cheapest), Smooth (as vanilla) or Temporal (grainy unless Anti-aliasing is TAA)." = "태양 그림자 가장자리의 처리 방식입니다. 빠름은 가장자리가 뚜렷하고 부하가 적습니다. 부드럽게는 원본과 비슷하고, 시간축은 TAA가 꺼져 있으면 거칠어 보입니다."
"Size of the sun's and the flashlight's shadow maps: 4096 draws sharper shadows than 2048. It takes more video memory and a little frame rate." = "태양과 손전등의 그림자 맵 크기입니다. 4096은 2048보다 선명하지만 그래픽 메모리를 더 쓰고 프레임률이 조금 줄어듭니다."
"Creases, corners and the ground under things darken by how enclosed they are: Off, Performance (cheaper, a little grainier) or Quality. Not in the original." = "틈, 모서리, 물체 아래가 가려진 정도에 따라 어두워집니다. 끄기, 성능, 품질 중에서 선택하세요. 성능은 부하가 적지만 약간 거칠게 보입니다. 원본에는 없는 기능입니다."
"On: the sun's shadows reach half as far again as the shadow distance. Costs a little frame rate." = "켜면 태양 그림자가 설정 거리의 1.5배까지 표시됩니다. 프레임률이 조금 줄어듭니다."
"On: the weather's clouds cast soft shadows that drift over the land, only where the cover is heavier than around it. Still being tuned. Not in the original." = "켜면 주변보다 구름이 짙은 곳에서 부드러운 구름 그림자가 지표를 따라 움직입니다. 조정 중인 기능이며 원본에는 없습니다."
"On: at a low sun, hills and mountains shade the land beyond the reach of the sun's shadows. Still being tuned. Not in the original." = "켜면 태양이 낮을 때 언덕과 산이 일반 태양 그림자의 표시 거리 너머에도 그늘을 드리웁니다. 조정 중인 기능이며 원본에는 없습니다."
"ALC (All Lights Cast): lamps, fires and spot lights cast shadows within the shadow distance, so walls stop their light. Performance redraws less often. Costs frame rate. Not in the original." = "ALC(All Lights Cast)는 그림자 거리 안에 있는 등불, 불, 스포트라이트가 그림자를 만들도록 합니다. 벽은 빛을 차단합니다. 성능 설정은 갱신 횟수를 줄입니다. 프레임률이 줄어들며 원본에는 없는 기능입니다."
"On: light brighter than a sunlit white wall (the sun, lamps, windows) glows into its surroundings, on top of the game's own image space." = "켜면 태양광을 받은 흰 벽보다 밝은 태양, 램프, 창의 빛이 주변으로 번집니다. 게임의 이미지 공간 효과에 더해집니다."
"On: neon, lamps, beams and fire glow softly, as the original's HDR glow does, as much as the place's image space asks. Bloom adds to it." = "켜면 원본의 HDR 효과와 같이 장소의 이미지 공간 설정에 맞춰 네온, 램프, 광선, 불빛이 은은하게 번집니다. 블룸 효과가 여기에 더해집니다."
"On: dark views brighten after a moment, as the eye gets used to the dark, by the place's image space. Needs the light glow." = "켜면 눈이 어둠에 적응하듯 어두운 화면이 잠시 뒤 장소의 이미지 공간 설정에 맞춰 밝아집니다. 빛 번짐을 켜야 합니다."
"On: where the image space asks for a strong glow (the Strip at night) neon burns with a wide halo, as in the original. Needs the light glow." = "켜면 밤의 스트립처럼 이미지 공간 설정의 빛 번짐이 강한 곳에서 원본처럼 네온 주변에 넓은 빛무리가 생깁니다. 빛 번짐을 켜야 합니다."
"On: the final picture is sharpened where it has little contrast (contrast-adaptive sharpening)." = "켜면 완성된 화면에서 대비가 낮은 부분을 선명하게 합니다. 대비 적응형 선명화가 적용됩니다."
"On: textures seen at a slant stay sharp further (16x instead of 8x). For textures loaded from now on (the cells loaded next)." = "켜면 비스듬히 본 텍스처가 먼 곳까지 선명하게 보입니다. 8배 대신 16배를 적용하며 이후 로딩하는 셀의 텍스처부터 적용됩니다."
"On: sunlight streams past what stands in front of the sun, stronger the hazier the weather's fog. Not in the original." = "켜면 태양을 가리는 물체 가장자리로 태양 광선이 보입니다. 안개가 짙을수록 효과가 강해집니다. 원본에는 없는 기능입니다."
"On: water the mirrored reflection does not reach (another height, interiors) reflects what is on the screen instead of only the sky." = "켜면 높이가 다르거나 실내라서 거울 반사가 닿지 않는 물에 하늘만 비추는 대신 화면에 보이는 장면이 반사됩니다."
"On: water mirrors the world above it, as in the original, drawing the scene a second time. Off: it reflects the sky." = "켜면 원본처럼 물 위의 월드 장면을 한 번 더 그려 물에 비춥니다. 끄면 하늘만 비춥니다."
"On: softens where outdoor roads, rocks and cliffs meet the landscape, giving them the ground's colour and light there. Not in the original." = "켜면 야외 도로, 바위, 절벽이 지형과 만나는 경계에 지면의 색과 조명을 입혀 부드럽게 연결합니다. 원본에는 없는 기능입니다."
"Sets the rows the original's quality presets cover to the game folder's low.ini to VeryHigh.ini, and Smooth terrain (Off at Low and Medium). Custom: those rows match none of them." = "원본의 그래픽 품질 사전 설정이 다루는 항목을 게임 폴더의 low.ini부터 VeryHigh.ini까지에 맞춰 설정합니다. 지형 매끄럽게 표시는 낮음과 중간에서 꺼집니다. 사용자 지정은 어느 사전 설정과도 일치하지 않습니다."
"DLSS files missing: choose Download DLSS… in this list, or put them in the dlss folder beside nvforever.exe, then restart" = "DLSS 파일이 없습니다. 이 목록에서 DLSS 다운로드…를 선택하거나 nvforever.exe 옆 dlss 폴더에 파일을 넣은 뒤 다시 시작하세요."
"The dlss folder holds NVIDIA's updater (nvngx_update.exe): remove it, then restart" = "dlss 폴더에 NVIDIA 업데이트 프로그램(nvngx_update.exe)이 있습니다. 해당 파일을 제거한 뒤 다시 시작하세요."
"A file in the dlss folder is not from the tested NVIDIA release (Streamline 2.14.16)" = "dlss 폴더에 확인된 NVIDIA 릴리스(Streamline 2.14.16)와 일치하지 않는 파일이 있습니다."
"A graphics card the game may use cannot run DLSS" = "게임에서 사용할 수 있는 그래픽 카드 중 하나가 DLSS를 지원하지 않습니다."
"Not on this GPU or driver (DLSS needs an NVIDIA RTX card)" = "이 GPU 또는 드라이버에서 사용할 수 없습니다. DLSS에는 NVIDIA RTX가 필요합니다."
"DLSS stopped working this session; it is tried again at the next start" = "이번 실행에서 DLSS가 중단되었습니다. 다음 실행에서 다시 시도합니다."
"Needs hardware-accelerated GPU scheduling" = "하드웨어 가속 GPU 스케줄링이 필요합니다"
"Files missing: Download DLSS… on the Upscaler row" = "파일이 없습니다. 업스케일러 설정에서 DLSS 다운로드…를 선택하세요"
"The DLSS Frame Generation files are missing" = "DLSS 프레임 생성 파일이 없습니다"
"Frames made between the real ones: smoother motion, input a little later. FSR 3.1 needs FSR upscaling; DLSS an RTX 40 or newer. Not in the original." = "실제로 렌더링한 프레임 사이에 프레임을 생성합니다. 움직임은 부드러워지고 입력 반응은 약간 늦어집니다. FSR 3.1에는 FSR 업스케일링이, DLSS에는 RTX 40 이상이 필요합니다. 원본에는 없는 기능입니다."
"How many frames DLSS frame generation makes per real frame: 2x one, 3x two, 4x three (3x and 4x on RTX 50 series). Not in the original." = "실제 프레임 사이에 생성하는 프레임 수입니다. 2배는 한 장, 3배는 두 장, 4배는 세 장입니다. 3배와 4배는 RTX 50 시리즈에서 지원합니다. 원본에는 없는 기능입니다."
"{choice} at a limit of {limit}: {real} real frames a second, which can feel choppy. Fewer generated frames, or a limit up to the display's refresh rate, give more." = "{choice}를 선택하고 {limit}으로 제한하면 실제 프레임률은 초당 {real} 프레임입니다. 움직임이 끊겨 보이면 생성하는 프레임 수를 줄이거나 화면 주사율까지 제한을 높이세요."
"The colour of the HUD and the menus: Amber (the default) or another; the sliders below set it to any colour." = "HUD와 메뉴의 색상입니다. 기본값은 호박색입니다. 아래 슬라이더로 원하는 색상을 지정할 수 있습니다."
"The colour of the Pip-Boy's screens (items, stats, data): Amber (the default) or another; the sliders below set it to any colour." = "핍보이의 아이템, 능력치, 데이터 화면 색상입니다. 기본값은 호박색입니다. 아래 슬라이더로 원하는 색상을 지정할 수 있습니다."
"Upscaling by NVIDIA Corporation, through NVIDIA Streamline" = "NVIDIA Corporation의 NVIDIA Streamline을 통한 업스케일링"
"Machine and game CPU use, read once a second. Game use is cores kept busy: 1.0 is one full core." = "시스템과 게임의 CPU 사용량을 초마다 읽습니다. 게임 사용량에서 1.0은 코어 하나를 모두 사용하는 상태입니다."
"GPU use, read once a second: on Windows the busiest engine across programs; on Linux the whole device's, or the game's own where the driver tells." = "GPU 사용량을 초마다 읽습니다. Windows에서는 전체 프로그램 중 부하가 가장 큰 GPU 엔진을, Linux에서는 장치 전체 또는 드라이버가 제공하는 게임 사용량을 표시합니다."
"The upscaler drawing now: its name and mode, and the sizes the world is drawn at and rebuilt to. Off and the window's size while nothing upscales." = "현재 업스케일러의 이름과 모드, 월드의 렌더링 해상도와 재구성 해상도를 표시합니다. 업스케일링을 사용하지 않을 때는 끄기와 창 크기를 표시합니다."
"Smooths height steps while keeping bumps and ridges: 2 x 2 or 4 x 4 squares per landscape square, or 4 x 4 near you and 2 x 2 further. Drawing and collision share it. Applies at the next start." = "요철과 능선을 유지하면서 지형의 높이 단차를 줄입니다. 지형 격자 하나를 2 × 2나 4 × 4로 나누거나, 가까운 곳은 4 × 4, 먼 곳은 2 × 2로 나눕니다. 렌더링과 충돌에 모두 적용되며 다음 실행부터 반영됩니다."
"On: a container, body or (sneaking) pocket under the crosshair lists its items without pausing. Activate takes, Ready Item takes all, Wait opens the menu." = "켜면 조준점 아래의 보관함, 시체 또는 은신 상태에서 다른 인물의 소지품을 게임을 멈추지 않고 표시합니다. 상호 작용으로 가져가고, 무기 꺼내기 키로 모두 가져가며, 대기 키로 메뉴를 엽니다."
"Size of the Quick Loot list, independent of HUD scale." = "빠른 루팅 목록의 크기입니다. HUD 크기와 별개입니다."
"How dark the box behind the Quick Loot list's words is." = "빠른 루팅 목록의 배경이 얼마나 어두운지 조정합니다."
"Quick Loot lists each item's value divided by its weight." = "빠른 루팅 목록에 아이템 가치를 무게로 나눈 값을 표시합니다."
"Enter or a click opens or closes this category; Left closes it, Right opens it." = "Enter를 누르거나 클릭하면 이 분류가 열리거나 닫힙니다. 왼쪽 방향키로 닫고 오른쪽 방향키로 엽니다."
"Which group of tweaks the list shows: Enter or a click opens the groups, Left and Right step. The search finds every tweak." = "목록에 표시할 세부 설정 그룹입니다. Enter를 누르거나 클릭하면 그룹 선택이 열리고 좌우 방향키로 이동합니다. 검색은 모든 그룹을 대상으로 합니다."
"The menus' letters. Original: the game's own font (Sharp for a language it has no letters for). Sharp: Roboto Condensed, sharp at any resolution, titles bold." = "메뉴 글꼴입니다. 원본은 게임의 글꼴을 사용하며 해당 언어의 글자가 없으면 선명으로 전환합니다. 선명은 해상도에 상관없이 선명한 Roboto Condensed를 사용하고 제목을 굵게 표시합니다."
"On: the far ground near the horizon shimmers slightly on hot, clear days, by the sun and the weather. A prototype. Not in the original." = "켜면 맑고 더운 날 태양과 날씨에 따라 수평선 근처의 지면이 약하게 일렁입니다. 원본에는 없는 실험 기능입니다."

